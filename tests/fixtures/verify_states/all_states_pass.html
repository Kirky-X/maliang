<!DOCTYPE html>
<!--
  verify-states fixture:三态全绿(对照)。

-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>verify-states fixture: 三态全绿</title>
<style>
  body { background: #FFFFFF; color: #1A1A1A; font-family: system-ui, sans-serif; }
  .submit { background: #FFFFFF; color: #1A1A1A; border: 1px solid #1A1A1A; padding: 8px 16px; }
  .submit:hover { color: #0F0F0F; }
  .submit:focus { color: #0F0F0F; outline: 2px solid #1A1A1A; }
</style>
</head>
<body>
  <main id="main">
    <button class="submit" type="button">提交订单</button>
  </main>
